name: ios

on:
  push:
    branches: [ "main" , "feat/dual-build-ffmpeg"]
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'packages/firebase_core_stub/**'
      - 'packages/firebase_messaging_stub/**'
      - 'scripts/build.sh'
      - 'scripts/configure_build.py'
      - 'scripts/verify_firebase_dependencies.py'
      - '**/dart_ios.yml'

jobs:
  build:
    if: "contains(github.event.head_commit.message, 'ios')"
    runs-on: macos-latest
    steps:
      - name: Output Commit Information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "触发此次action的提交ID: $COMMIT_SHA"
          echo "提交信息: $COMMIT_MESSAGE"
          echo "提交作者: $COMMIT_AUTHOR"
          GITHASH="${COMMIT_SHA:0:7}"
          echo "GITHASH=$GITHASH" >> $GITHUB_ENV
          echo "GITHASH (前7位): $GITHASH"
      - uses: actions/checkout@v4
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          
      - run: flutter --version
      - name: Exclude Firebase SDKs from this platform
        run: python3 scripts/configure_build.py firebase stub
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub
      
      # ============ 第一遍: 带 FFmpeg 版本 ============
      # 切换为带 FFmpeg 配置（默认，幂等）
      - name: Switch to FFmpeg-enabled config
        run: bash scripts/build.sh with
        
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub
      
      # 安装 CocoaPods 依赖
      - name: Install CocoaPods dependencies (ffmpeg)
        run: |
          cd ios
          pod install
      - name: Verify CocoaPods excludes Firebase
        run: python3 scripts/verify_firebase_dependencies.py stub --native ios
        
      # 构建 iOS app (无签名版本，用于测试)
      - name: Build iOS app (no codesign, ffmpeg)
        run: flutter build ios --release --no-codesign --dart-define=gitHash=${{ env.GITHASH }}
        
      # 打包为 .app 文件
      - name: Create .app archive (ffmpeg)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Runner.app.zip Payload
          mv Runner.app.zip ../../../listen1_xuan-ios-ffmpeg-${GITHASH}.app.zip
          cd ../../..
          
      # 上传 .app 文件
      - name: Upload .app artifact (ffmpeg)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-artifact-ffmpeg
          path: listen1_xuan-ios-ffmpeg-${{ env.GITHASH }}.app.zip

      # ============ 第二遍: 无 FFmpeg 精简版 ============
      - name: Switch to FFmpeg-free config
        run: bash scripts/build.sh without
        
      - run: flutter clean
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub
        
      # 安装 CocoaPods 依赖（无 ffmpeg 原生库）
      - name: Install CocoaPods dependencies (lite)
        run: |
          cd ios
          pod install
      - name: Verify CocoaPods excludes Firebase
        run: python3 scripts/verify_firebase_dependencies.py stub --native ios
        
      # 构建 iOS app (无签名版本，用于测试)
      - name: Build iOS app (no codesign, lite)
        run: flutter build ios --release --no-codesign --dart-define=gitHash=${{ env.GITHASH }}
        
      # 打包为 .app 文件
      - name: Create .app archive (lite)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Runner.app.zip Payload
          mv Runner.app.zip ../../../listen1_xuan-ios-${GITHASH}.app.zip
          cd ../../..
          
      # 上传 .app 文件
      - name: Upload .app artifact (lite)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-artifact
          path: listen1_xuan-ios-${{ env.GITHASH }}.app.zip
          
      # 从 pubspec.yaml 提取版本号
      - name: Extract Version from pubspec.yaml
        id: extract_version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "VERSION=$version" >> $GITHUB_ENV
        shell: bash
        
      - name: Debug Version
        run: echo "${{ env.VERSION }}"
      
      # 删除该 Release 下所有旧的 iOS 构建文件
      - name: Delete Old iOS Assets from Release
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' | grep -E 'listen1_xuan-ios-.+\.app\.zip$' | while read asset; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "${{ env.VERSION }}" "$asset" --yes || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      # 上传到 Release（带 FFmpeg 版 + 精简版）
      - name: Upload New Asset to Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            listen1_xuan-ios-ffmpeg-${{ env.GITHASH }}.app.zip
            listen1_xuan-ios-${{ env.GITHASH }}.app.zip
          prerelease: ${{ !contains(github.event.head_commit.message, 'sta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

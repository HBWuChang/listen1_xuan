name: macos

on:
  push:
    branches: [ "main" , "feat/dual-build-ffmpeg"]
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - '**/dart_macos.yml'
      - 'macos/**'

jobs:
  # 每个矩阵任务只编一种架构（ARCHS 经 FLUTTER_XCODE_ 前缀注入 xcodebuild），
  # 产物命名带芯片标记（apple-silicon / intel）。注意不能用 arm64 / x86_64 命名：
  # Android 端 artifact 选择按这些子串过滤架构，会把 macOS 包也列出来。
  build:
    if: "contains(github.event.head_commit.message, 'macos')"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  tag: apple-silicon, ffmpeg: with,    variant: ffmpeg, artifact: macos-app-artifact-ffmpeg }
          - { arch: x86_64, tag: intel,         ffmpeg: with,    variant: ffmpeg, artifact: macos-app-artifact-ffmpeg }
          - { arch: arm64,  tag: apple-silicon, ffmpeg: without, variant: lite,   artifact: macos-app-artifact }
          - { arch: x86_64, tag: intel,         ffmpeg: without, variant: lite,   artifact: macos-app-artifact }
    steps:
      - name: Output Commit Information
        run: |
          echo "触发此次action的提交ID: ${{ github.sha }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"
          echo "提交作者: ${{ github.event.head_commit.author.name }}"
          GITHASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "GITHASH=$GITHASH" >> $GITHUB_ENV
          echo "GITHASH (前7位): $GITHASH"

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'

      - run: flutter --version

      - name: Switch FFmpeg config (${{ matrix.ffmpeg }})
        run: bash scripts/build.sh ${{ matrix.ffmpeg }}

      - run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd macos
          pod install

      - name: Replace GITHASH in distribute_options.yaml
        run: |
          sed -i '' "s/\$GITHASH/${{ env.GITHASH }}/g" distribute_options.yaml
        shell: bash

      - name: Build macOS app (${{ matrix.arch }})
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'NO'
        run: |
          dart pub global activate fastforge
          fastforge release --name prod

      - name: Verify single-arch, extract version, rename asset
        id: rename
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/listen1_xuan.app"
          WANT="${{ matrix.arch }}"
          GOT=$(lipo -archs "$APP/Contents/MacOS/listen1_xuan")
          echo "main exe archs: $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::expected $WANT, got $GOT"
            exit 1
          fi
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            a=$(lipo -archs "$f" 2>/dev/null || true)
            if [ "$a" != "$WANT" ]; then
              echo "::error::not single-arch: $f -> $a"
              bad=1
            fi
          done < <(find "$APP" -type f -print0)
          [ "$bad" -eq 0 ] || exit 1

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [ "${{ matrix.variant }}" = "ffmpeg" ]; then
            NEW="listen1_xuan-$VERSION-macos-${{ matrix.tag }}-ffmpeg-$GITHASH.zip"
          else
            NEW="listen1_xuan-$VERSION-macos-${{ matrix.tag }}-$GITHASH.zip"
          fi
          mv "dist/$VERSION/listen1_xuan-$VERSION-macos.zip" "dist/$VERSION/$NEW"
          echo "ASSET_NAME=$NEW" >> $GITHUB_ENV
          # 用文件级路径上传：archive 根就是该文件名，下载后不会带版本子目录
          echo "asset_path=dist/$VERSION/$NEW" >> $GITHUB_OUTPUT
          echo "renamed -> $NEW"

      - name: Verify packaged app and updater permissions
        run: |
          set -euo pipefail
          CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$CHECK_DIR"' EXIT
          /usr/bin/ditto -x -k "${{ steps.rename.outputs.asset_path }}" "$CHECK_DIR"
          APP="$CHECK_DIR/listen1_xuan.app"
          test -L "$APP/Contents/Frameworks/App.framework/Resources"
          test -f "$APP/Contents/Frameworks/App.framework/App"
          test -d "$APP/Contents/Frameworks/App.framework/Resources/flutter_assets"
          test -x "$APP/Contents/MacOS/listen1_xuan"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" > "$CHECK_DIR/entitlements.plist"
          SANDBOX=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$CHECK_DIR/entitlements.plist" 2>/dev/null || true)
          if [ "$SANDBOX" = "true" ]; then
            echo "::error::Direct-distribution updater cannot run inside App Sandbox"
            exit 1
          fi

      - name: Upload artifact (${{ matrix.tag }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.tag }}
          path: ${{ steps.rename.outputs.asset_path }}
          if-no-files-found: error

  # 单一上传点：避免多个矩阵任务互相删除/覆盖同一 Release 资产。
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-app-artifact-*
          merge-multiple: true
          path: dist-assets

      # upload-artifact 会保留搜索路径的共同父目录（版本号目录），这里拍平。
      - name: Flatten downloaded assets
        run: |
          set -euo pipefail
          echo "--- before ---"
          find dist-assets -type f | sort
          find dist-assets -mindepth 2 -type f -name '*.zip' -exec mv -f {} dist-assets/ \;
          find dist-assets -mindepth 1 -type d -empty -delete
          echo "--- after ---"
          ls -l dist-assets/*.zip

      - name: Extract Version from pubspec.yaml
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "VERSION=$version"

      - name: Delete Old macOS Assets from Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' \
            | grep -E 'listen1_xuan-.+-macos-.+\.zip$' \
            | while read -r asset; do
                echo "Deleting old asset: $asset"
                gh release delete-asset "${{ env.VERSION }}" "$asset" --yes || true
              done

      - name: Upload New Assets to Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist-assets/*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ !contains(github.event.head_commit.message, 'sta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

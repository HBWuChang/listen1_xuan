name: win

on:
  push:
    branches: [ "main" , "feat/dual-build-ffmpeg"]
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'packages/firebase_core_stub/**'
      - 'packages/firebase_messaging_stub/**'
      - 'scripts/build.sh'
      - 'scripts/configure_build.py'
      - 'scripts/verify_firebase_dependencies.py'
      - '**/dart_win.yml'

jobs:
  build:
    if: "contains(github.event.head_commit.message, 'win')"
    runs-on: windows-latest
    steps:
      - name: Output Commit Information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "触发此次action的提交ID: $env:COMMIT_SHA"
          echo "提交信息: $env:COMMIT_MESSAGE"
          echo "提交作者: $env:COMMIT_AUTHOR"
          $GITHASH = "$env:COMMIT_SHA".Substring(0,7)
          echo "GITHASH=$GITHASH" >> $env:GITHUB_ENV
          echo "GITHASH (前7位): $GITHASH"
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
      - run: flutter --version
      - name: Exclude Firebase SDKs from this platform
        run: python scripts/configure_build.py firebase stub
        shell: bash
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python scripts/verify_firebase_dependencies.py stub
        shell: bash

      # ============ 第一遍: 带 FFmpeg 版本 ============
      - name: Switch to FFmpeg-enabled config
        shell: bash
        run: bash scripts/build.sh with

      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python scripts/verify_firebase_dependencies.py stub
        shell: bash

      - run: flutter build windows --dart-define=gitHash=${{ env.GITHASH }}
      - name: Upload Build Artifact (ffmpeg)
        uses: actions/upload-artifact@v4
        with:
              name: windows-build-artifact-ffmpeg
              path: build/windows/x64/runner/Release/**
         # 打包构建产物为 ZIP 文件（输出到 release_artifacts/，避免被
         # 第二遍的 flutter clean 清理 build/ 时删除）
      - name: Compress Build Artifacts (ffmpeg)
        run: |
          mkdir -p release_artifacts
          powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release_artifacts/windows-build-artifact-ffmpeg-${{ env.GITHASH }}.zip

      # ============ 第二遍: 无 FFmpeg 精简版 ============
      - name: Switch to FFmpeg-free config
        shell: bash
        run: bash scripts/build.sh without

      - run: flutter clean
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python scripts/verify_firebase_dependencies.py stub
        shell: bash

      - run: flutter build windows --dart-define=gitHash=${{ env.GITHASH }}
      - name: Upload Build Artifact (lite)
        uses: actions/upload-artifact@v4
        with:
              name: windows-build-artifact
              path: build/windows/x64/runner/Release/**
         # 打包构建产物为 ZIP 文件（同样输出到 release_artifacts/）
      - name: Compress Build Artifacts (lite)
        run: |
          powershell Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release_artifacts/windows-build-artifact-${{ env.GITHASH }}.zip

      # 从 pubspec.yaml 提取版本号
      - name: Extract Version from pubspec.yaml
        id: extract_version
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line -replace 'version:\s*', '' }).Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Debug Version
        run: echo "${{ env.VERSION }}"
      
      # 删除该 Release 下所有旧的 Windows 构建文件
      - name: Delete Old Windows Assets from Release
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' | Select-String -Pattern 'windows-build-artifact-.+\.zip$' | ForEach-Object {
            $asset = $_.Line.Trim()
            Write-Host "Deleting old asset: $asset"
            gh release delete-asset "${{ env.VERSION }}" "$asset" --yes 2>$null
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        shell: pwsh
        
      # 上传新的资产到最新 Release（带 FFmpeg 版 + 精简版）
      - name: Upload New Asset to Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            release_artifacts/windows-build-artifact-ffmpeg-${{ env.GITHASH }}.zip
            release_artifacts/windows-build-artifact-${{ env.GITHASH }}.zip
          prerelease: ${{ !contains(github.event.head_commit.message, 'sta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          